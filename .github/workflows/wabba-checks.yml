name: Wabba integration checks

on:
  pull_request:
  push:
    branches: [main, 'codex/wabba-*']

permissions:
  contents: read

jobs:
  browser-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          for source in *.js; do
            node --input-type=module --check < "$source" || exit 1
          done
      - name: Check account-link protocol and UI controllers
        run: node --test tests/*.test.mjs
